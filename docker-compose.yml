name: net-perform

# ============================================================================
# net-perform — Sadeleştirilmiş gözlemlenebilirlik/performans altyapısı
#
# Orijinal docker-compose.infra.yml'den TÜRETİLMİŞTİR. Aşağıdaki servisler
# BİLİNÇLİ OLARAK ÇIKARILDI (sadece performans/gözlemlenebilirlik odaklı bir
# alt küme isteniyor): redis, kafka, kafka-ui, vault, keycloak, consul,
# rabbitmq, nginx.
#
# Container isimlerine, talep edildiği gibi "permon-" ön eki eklendi
# (örn. neominal-postgres -> permon-neominal-postgres). SERVİS adları
# (postgres, seq, otel-collector, prometheus, grafana) DEĞİŞMEDİ — Docker
# Compose içi DNS çözümlemesi (örn. "http://prometheus:9090") servis adı
# üzerinden çalışır, container_name'den etkilenmez. Bu yüzden provisioning
# dosyalarında (grafana datasource, prometheus.yml) herhangi bir adres
# güncellemesi GEREKMEDİ.
# ============================================================================

networks:
  neominal-net:
    driver: bridge
    name: neominal-net

volumes:
  postgres-data:
  seq-data:
  otel-collector-data:
  prometheus-data:
  grafana-data:
    name: net-perform_grafana-data-v2
  jaeger-data:

services:
  # ----------------------------------------------------------------
  # PostgreSQL - Uygulama veritabanı
  # ----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: permon-neominal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: neominal_demo
      POSTGRES_USER: neominal
      POSTGRES_PASSWORD: neominal_pass
    ports:
      - '15432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neominal -d neominal_demo']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neominal-net

  # ----------------------------------------------------------------
  # Seq - Serilog structured log sink + arama arayüzü
  # ----------------------------------------------------------------
  seq:
    image: datalust/seq:latest
    container_name: permon-neominal-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:-dev-seq-password}
    ports:
      - '5341:5341' # Serilog ingestion endpoint
      - '8081:80' # Seq Web UI
    volumes:
      - seq-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/api']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - neominal-net

  # ----------------------------------------------------------------
  # OpenTelemetry Collector - Trace/Metric aggregator
  # ----------------------------------------------------------------
  otel-collector:
    build:
      context: ./infra/otel-collector
      dockerfile: Dockerfile
    container_name: permon-neominal-otel-collector
    restart: unless-stopped
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./infra/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - otel-collector-data:/var/lib/otel-collector
    ports:
      - '4317:4317' # OTLP gRPC receiver (← .NET buradan gönderir)
      - '4318:4318' # OTLP HTTP receiver
      - '13133:13133' # Collector health
      - '8889:8889' # Prometheus exporter
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:13133/']
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      seq:
        condition: service_healthy
    networks:
      - neominal-net

  # ----------------------------------------------------------------
  # Prometheus - Metrik toplama
  # ----------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: permon-neominal-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9090/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 10
    extra_hosts:
      - 'host.docker.internal:host-gateway' # Linux'ta host.docker.internal çözümlemesi için
    networks:
      - neominal-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: permon-neominal-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://neominal:neominal_pass@postgres:5432/neominal_demo?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9187/metrics']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - neominal-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: permon-neominal-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
    volumes:
      - jaeger-data:/badger
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:16686/']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - neominal-net

  api:
    build:
      context: .
      dockerfile: RestApi/Dockerfile
    container_name: net-perform-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=neominal_demo;Username=neominal;Password=neominal_pass
      OpenTelemetry__ServiceName: rest-api
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
      Seq__Url: http://seq:5341
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
      seq:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    networks:
      - neominal-net

  # ----------------------------------------------------------------
  # Grafana - Metrik görselleştirme (Prometheus datasource ile)
  # ----------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: permon-neominal-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-grafana-password}
    ports:
      - '3000:3000'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - neominal-net
