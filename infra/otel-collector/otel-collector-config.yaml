receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    # DİKKAT: 8888 KULLANMAYIN — Collector'ın kendi iç telemetri sunucusu
    # (service::telemetry::metrics) varsayılan olarak 0.0.0.0:8888'i zaten
    # kullanıyor. Aynı portu burada da vermek "address already in use" hatası
    # verir. Bu yüzden farklı bir port (8889) kullanıyoruz.
    endpoint: "0.0.0.0:8889"
    resource_to_telemetry_conversion:
      enabled: true
  debug: # "logging" exporter'ı deprecate edildi, yerine "debug" geldi
    verbosity: detailed

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
